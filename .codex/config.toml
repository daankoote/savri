#:schema https://developers.openai.com/codex/config-schema.json

# ENVAL project-local defaults. Effective loading requires a fresh trusted session.
approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = "enval-dev"

[agents]
enabled = true
max_concurrent_threads_per_session = 2

[features]
network_proxy = true

[permissions.enval-dev]
description = "ENVAL local development: project writes, temp and loopback; no public network or Git mutation."
extends = ":workspace"

[permissions.enval-dev.filesystem.":workspace_roots"]
".git" = "read"
".codex" = "read"

[permissions.enval-dev.network]
enabled = true
allow_local_binding = true
allow_upstream_proxy = false
dangerously_allow_non_loopback_proxy = false
dangerously_allow_all_unix_sockets = false

[permissions.enval-dev.network.unix_sockets]
"/Users/daankoote/.docker/run/docker.sock" = "allow"

[permissions.enval-dev.network.domains]
"localhost" = "allow"
"127.0.0.1" = "allow"

[shell_environment_policy]
inherit = "core"
experimental_use_profile = false
ignore_default_excludes = false

[shell_environment_policy.set]
SUPABASE_TELEMETRY_DISABLED = "1"
DO_NOT_TRACK = "1"

[browser_use]
allow_history_access = false

[browser_use.default_origin_policy]
access = "deny"
downloads = "deny"
uploads = "deny"
full_cdp_access = "deny"

[browser_use.origins."http://127.0.0.1:5175"]
access = "allow"
downloads = "deny"
uploads = "deny"
full_cdp_access = "deny"

[browser_use.origins."http://127.0.0.1:54321"]
access = "allow"
downloads = "deny"
uploads = "deny"
full_cdp_access = "deny"

[browser_use.origins."http://127.0.0.1:54324"]
access = "allow"
downloads = "deny"
uploads = "deny"
full_cdp_access = "deny"

[mcp_servers.supabase]
enabled = false

[mcp_servers.supabase_enval_readonly]
url = "https://mcp.supabase.com/mcp?project_ref=yzngrurkpfuqgexbhzgl&read_only=true&features=database%2Cdebugging%2Cdocs"
scopes = ["database:read", "analytics:read"]
enabled = true
enabled_tools = [
  "execute_sql",
  "get_advisors",
  "list_extensions",
  "list_migrations",
  "list_tables",
  "query_logs",
  "search_docs",
]
default_tools_approval_mode = "writes"
