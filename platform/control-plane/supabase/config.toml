project_id = "enval-control-plane"

[api]
enabled = true
port = 56321
schemas = ["public", "graphql_public", "platform"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[api.tls]
enabled = false

[db]
port = 56322
shadow_port = 56320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 56329
pool_mode = "transaction"
default_pool_size = 10
max_client_conn = 50

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false
port = 56323
api_url = "http://127.0.0.1"

[inbucket]
enabled = false
port = 56324

[storage]
enabled = false
file_size_limit = "1MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:56321"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "1m"

[edge_runtime]
enabled = false
policy = "per_worker"
inspector_port = 56328
deno_version = 2

[analytics]
enabled = false
port = 56327
backend = "postgres"
